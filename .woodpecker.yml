when:
  - event: push
    branch: main

steps:
  test-and-typecheck:
    image: node:22-alpine
    volumes:
      - sanctuary-npm-cache:/root/.npm
    commands:
      - npm ci
      - npm run typecheck
      - npm test

  build-and-push:
    image: docker:29-cli
    depends_on: [test-and-typecheck]
    environment:
      REGISTRY:
        from_secret: REGISTRY
      REGISTRY_USERNAME:
        from_secret: REGISTRY_USERNAME
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - SHORT_SHA="$(printf %s "$CI_COMMIT_SHA" | cut -c1-7)"
      - IMAGE="$REGISTRY/sanctuary:sha-$SHORT_SHA"
      - MIGRATE_IMAGE="$REGISTRY/sanctuary-migrate:sha-$SHORT_SHA"
      - RUNTIME_CACHE="$REGISTRY/sanctuary-cache:runtime"
      - MIGRATE_CACHE="$REGISTRY/sanctuary-cache:migrate"
      - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
      - docker buildx create --use --name sanctuary-builder --bootstrap
      - docker buildx build --pull --target runtime --tag "$IMAGE" --tag "$REGISTRY/sanctuary:latest" --cache-from "type=registry,ref=$RUNTIME_CACHE" --cache-to "type=registry,ref=$RUNTIME_CACHE,mode=max" .
      - docker buildx build --pull --target migrate --tag "$MIGRATE_IMAGE" --tag "$REGISTRY/sanctuary-migrate:latest" --cache-from "type=registry,ref=$MIGRATE_CACHE" --cache-to "type=registry,ref=$MIGRATE_CACHE,mode=max" .
      - docker push "$IMAGE"
      - docker push "$REGISTRY/sanctuary:latest"
      - docker push "$MIGRATE_IMAGE"
      - docker push "$REGISTRY/sanctuary-migrate:latest"
